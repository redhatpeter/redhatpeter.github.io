<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">MCP Governance cover</title>
  <desc id="desc">A gateway turns a noisy field of API tools into a clear governed tool surface for an AI agent.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f3f3f3" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#2a2a2a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#0550ae"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity="0.62"/>
  <rect x="0" y="0" width="22" height="900" fill="#0056b2"/>

  <text x="92" y="96" fill="#0056b2" font-family="Lato, sans-serif" font-size="25" font-weight="700" letter-spacing="3">MCP GOVERNANCE</text>
  <text x="92" y="182" fill="#2a2a2a" font-family="Lato, sans-serif" font-size="58" font-weight="700">When every API becomes</text>
  <text x="92" y="252" fill="#2a2a2a" font-family="Lato, sans-serif" font-size="58" font-weight="700">an agent tool</text>
  <text x="94" y="303" fill="#757575" font-family="Source Sans Pro, sans-serif" font-size="25">Turn tool sprawl into a clear, canonical, and secure runtime surface.</text>

  <!-- Noisy tools -->
  <g font-family="Source Sans Pro, sans-serif" font-size="20" fill="#34343c">
    <rect x="95" y="405" width="260" height="64" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="128" cy="437" r="9" fill="#0056b2"/><text x="151" y="444">customer_create</text>

    <rect x="125" y="494" width="260" height="64" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="158" cy="526" r="9" fill="#868e96"/><text x="181" y="533">CreateCustomer</text>

    <rect x="76" y="583" width="260" height="64" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="109" cy="615" r="9" fill="#0056b2"/><text x="132" y="622">customer_create_v3</text>

    <rect x="138" y="672" width="260" height="64" rx="6" fill="#ffffff" stroke="#dee2e6" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="171" cy="704" r="9" fill="#868e96"/><text x="194" y="711">customer.lookup</text>
  </g>
  <text x="94" y="792" fill="#757575" font-family="Source Sans Pro, sans-serif" font-size="19" font-weight="700" letter-spacing="2">NOISY TOOL SPACE</text>

  <!-- Flow into gateway -->
  <path d="M420 568 C500 568 523 568 580 568" fill="none" stroke="#0550ae" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <g filter="url(#shadow)">
    <rect x="610" y="405" width="380" height="330" rx="8" fill="#2a2a2a"/>
    <rect x="610" y="405" width="380" height="14" rx="7" fill="#0056b2"/>
  </g>
  <text x="800" y="475" text-anchor="middle" fill="#ffffff" font-family="Lato, sans-serif" font-size="39" font-weight="700">Governance</text>
  <text x="800" y="520" text-anchor="middle" fill="#c2c6cc" font-family="Source Sans Pro, sans-serif" font-size="23">at the gateway</text>

  <g font-family="Source Sans Pro, sans-serif" font-size="21">
    <circle cx="681" cy="589" r="24" fill="#0056b2"/><text x="681" y="597" text-anchor="middle" fill="#fff" font-weight="700">L1</text>
    <text x="726" y="597" fill="#fff">Lint names &amp; schemas</text>
    <circle cx="681" cy="647" r="24" fill="#6f8fbd"/><text x="681" y="655" text-anchor="middle" fill="#fff" font-weight="700">L2</text>
    <text x="726" y="655" fill="#fff">Resolve duplicates</text>
    <circle cx="681" cy="705" r="24" fill="#2da44e"/><text x="681" y="713" text-anchor="middle" fill="#fff" font-weight="700">L3</text>
    <text x="726" y="713" fill="#fff">Enforce at runtime</text>
  </g>

  <!-- Flow out -->
  <path d="M1020 568 C1080 568 1090 568 1140 568" fill="none" stroke="#0550ae" stroke-width="5" marker-end="url(#arrow)"/>

  <!-- Governed tool surface -->
  <g filter="url(#shadow)">
    <rect x="1170" y="446" width="330" height="238" rx="8" fill="#ffffff" stroke="#0550ae" stroke-width="3"/>
  </g>
  <rect x="1170" y="446" width="330" height="60" rx="6" fill="#0550ae"/>
  <text x="1335" y="485" text-anchor="middle" fill="#ffffff" font-family="Source Sans Pro, sans-serif" font-size="20" font-weight="700" letter-spacing="1">GOVERNED MCP</text>

  <circle cx="1223" cy="565" r="18" fill="#2da44e"/>
  <path d="M1214 565 l7 7 13 -16" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1260" y="573" fill="#2a2a2a" font-family="Source Sans Pro, sans-serif" font-size="25" font-weight="700">customer.create</text>
  <line x1="1210" y1="609" x2="1460" y2="609" stroke="#dee2e6" stroke-width="2"/>
  <text x="1335" y="647" text-anchor="middle" fill="#757575" font-family="Source Sans Pro, sans-serif" font-size="20">Canonical · Secure · Observable</text>

  <!-- Agent badge -->
  <circle cx="1450" cy="748" r="56" fill="#0056b2" filter="url(#shadow)"/>
  <circle cx="1450" cy="735" r="16" fill="none" stroke="#fff" stroke-width="5"/>
  <path d="M1417 775 C1423 751 1477 751 1483 775" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <text x="1365" y="832" fill="#757575" font-family="Source Sans Pro, sans-serif" font-size="19" font-weight="700" letter-spacing="2">CLEARER CHOICES</text>
</svg>
